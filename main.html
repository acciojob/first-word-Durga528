<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extract First Word</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h2>Extract First Word</h2>

    <label for="strInput">Input String:</label>
    <input type="text" id="strInput" placeholder="e.g. see and stop" value="see and stop">

    <button id="extractBtn">Extract</button>

    <h3>First Word:</h3>
    <div id="result" class="result-box">see</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
